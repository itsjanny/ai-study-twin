import heapq

# BFS Shortest Path O(V+E)
def bfs(adj, start, target):
    dist = {start: 0}
    q = deque([start])
    while q:
        u = q.popleft()
        if u == target: return dist[u]
        for v in adj.get(u, []):
            if v not in dist:
                dist[v] = dist[u]+1
                q.append(v)
    return -1

# Dijkstra O((V+E) log V)
def dijkstra(adj, src, n):
    dist = [float('inf')]*n
    dist[src] = 0
    heap = [(0, src)]
    while heap:
        d, u = heapq.heappop(heap)
        if d > dist[u]: continue
        for v, w in adj.get(u, []):
            if dist[u]+w < dist[v]:
                dist[v] = dist[u]+w
                heapq.heappush(heap, (dist[v], v))

def knapsack(W, wt, val):

def lcs(s1, s2):

function lsLoad(email){
  const k="ast_v3_"+(email||"demo");
  try{const d=JSON.parse(localStorage.getItem(k));
    if(d&&d.subjects&&d.subjects.length>=4){
      if(!d.streak)d.streak=0;
      if(!d.lastStudyDate)d.lastStudyDate=null;
      if(!d.attempts)d.attempts=[];
      return d;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

}

// Streak update
function updStreak(s){
  const today=new Date().toISOString().slice(0,10);
  if(s.lastStudyDate===today)return s;
  const yd=new Date();yd.setDate(yd.getDate()-1);
  const ydStr=yd.toISOString().slice(0,10);
  const newStreak=s.lastStudyDate===ydStr?(s.streak||0)+1:1;
  return {...s,streak:newStreak,lastStudyDate:today};
}

// Achievements
function getAchievements(s){
  const all=s.subjects.flatMap(x=>x.topics);
  const totalAtt=all.reduce((a,t)=>a+t.att,0);
  const res=[];
  if(s.attempts.length>=1)res.push({id:"fq",name:"First Quiz 🎯",desc:"Completed first quiz"});
  if((s.streak||0)>=3)res.push({id:"s3",name:"3-Day Streak 🔥",desc:"3 consecutive days"});
  if((s.streak||0)>=7)res.push({id:"s7",name:"Week Warrior 🏆",desc:"7 consecutive days"});
  if(totalAtt>=10)res.push({id:"dl",name:"Dedicated Learner 📚",desc:"10+ quiz attempts"});
  if(totalAtt>=25)res.push({id:"sc",name:"Scholar 🎓",desc:"25+ completions"});
  const py=s.subjects.find(x=>x.id===1)?.topics||[];
  if(py.length&&py.every(t=>t.acc>=75))res.push({id:"pp",name:"Python Pro 🐍",desc:"All Python topics 75%+"});
  const dsa=s.subjects.find(x=>x.id===3)?.topics||[];
  if(dsa.length&&dsa.every(t=>t.acc>=70))res.push({id:"de",name:"DSA Expert ⚡",desc:"All DSA topics 70%+"});
  const java=s.subjects.find(x=>x.id===2)?.topics||[];
  if(java.length&&java.every(t=>t.acc>=70))res.push({id:"jd",name:"Java Dev ☕",desc:"All Java topics 70%+"});
  return res;
}

const ML={
  classify(acc,att,rs,diff){
    const ea=att>0?(rs*.6+acc*.4):50;
    const adj=ea+(diff-3)*2;
    const label=adj>=80?"Strong":adj>=60?"Average":adj>=40?"Weak":"Very Weak";
    return{label,ws:Math.round(Math.max(0,100-adj)),cs:Math.round(Math.min(100,Math.max(10,adj)))};
  },
  predict(t){
    if(!t)return 72;
    const base=t.rs*.45+t.acc*.4+t.cs*.15;
    const decay=Math.min(15,(t.lsd||3)*.8);
    const dp=(t.diff-3)*2.5;
    return Math.round(Math.max(15,Math.min(98,base-decay-dp))*10)/10;
  },
  recs(state,sid="all"){
    const subs=sid!=="all"?state.subjects.filter(s=>s.id===parseInt(sid)):state.subjects;
    const r=[];
    subs.forEach(sub=>sub.topics.forEach(t=>{
      const tf=Math.min(30,(t.lsd||1)*1.5);
      const ps=(t.ws*.45)+tf+(t.diff*3)+(t.imp*10);
      const dur=t.status==="Very Weak"||t.lsd>10?45:t.status==="Weak"||t.lsd>6?30:t.status==="Average"?20:10;
      const rev=t.status==="Very Weak"||t.lsd>10?"High (Intensive)":t.status==="Weak"||t.lsd>6?"Medium (Focused)":t.status==="Average"?"Moderate":"Light";
      r.push({tid:t.id,name:t.name,sid:sub.id,scode:sub.code,sname:sub.name,ps:Math.round(ps*10)/10,reason:`${sub.code} — ${t.name}: accuracy ${t.rs}%${t.lsd>7?`. Not studied in ${t.lsd} days!`:""}`,rev,dur});
    }));
    r.sort((a,b)=>b.ps-a.ps);
    return r.map((x,i)=>({...x,rank:i+1}));
  }
};

const Dashboard=({state,profile,setTab,setMOpen,onLogout})=>{

      const lbs=tsub?tsub.topics.map(t=>t.name.length>14?t.name.slice(0,12)+"…":t.name):state.subjects.map(s=>s.code);
      const dat=tsub?tsub.topics.map(t=>Math.round(t.acc)):state.subjects.map(s=>Math.round(s.topics.reduce((a,t)=>a+t.acc,0)/s.topics.length));

    }

// QUIZ TIMER
const Timer=({secs,maxSecs,onExpire})=>{
  const [left,setLeft]=React.useState(secs);
  React.useEffect(()=>{setLeft(secs);},[secs]);
  React.useEffect(()=>{
    const t=setInterval(()=>setLeft(p=>{if(p<=1){clearInterval(t);onExpire();return 0;}return p-1;}),1000);
    return()=>clearInterval(t);
  },[secs]);
  const pct=left/maxSecs;const r=20;const circ=2*Math.PI*r;
  const col=pct>.5?"#10b981":pct>.25?"#f59e0b":"#ef4444";
  return(
    <div className="flex items-center gap-1.5">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r={r} fill="none" stroke="rgba(255,255,255,.1)" strokeWidth="4"/>
        <circle cx="24" cy="24" r={r} fill="none" stroke={col} strokeWidth="4"
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"
          style={{transform:"rotate(-90deg)",transformOrigin:"50% 50%",transition:"stroke-dashoffset 1s linear,stroke .3s"}}/>
        <text x="24" y="29" textAnchor="middle" fill={col} fontSize="11" fontWeight="bold">{left}</text>
      </svg>
      <span className="text-[10px] text-slate-500">sec</span>
    </div>
  );
};

// QUIZ PAGE
const Quiz=({state,setState,setMOpen,onLogout,fbUser})=>{
  const all=state.subjects.flatMap(s=>s.topics);
  const [selId,setSelId]=React.useState(all[0]?.id||10101);
  const [qi,setQi]=React.useState(0);
  const [ans,setAns]=React.useState({});
  const [active,setActive]=React.useState(false);
  const [result,setResult]=React.useState(null);
  const [showExp,setShowExp]=React.useState(false);
  const [tkey,setTkey]=React.useState(0);

  const topic=all.find(t=>t.id===selId)||all[0];
  const pred=ML.predict(topic);
  const qs=QUESTIONS.filter(q=>q.tid===selId);
  const hasQ=qs.length>0;

  React.useEffect(()=>{if(window.lucide)lucide.createIcons();},[active,result,qi,showExp]);

  const start=()=>{if(!hasQ)return;setResult(null);setAns({});setQi(0);setTkey(k=>k+1);setActive(true);};

  const expire=()=>{if(qi<qs.length-1){setQi(c=>c+1);setTkey(k=>k+1);}else submit();};

  const submit=()=>{
    let correct=0;
    qs.forEach(q=>{if(ans[q.id]===q.ans)correct++;});
    const actual=Math.round(correct/qs.length*100);
    const diff=Math.round((actual-pred)*10)/10;
    const ns=JSON.parse(JSON.stringify(state));
    let subName="";
    ns.subjects.forEach(sub=>sub.topics.forEach(t=>{
      if(t.id===selId){
        t.att+=1;t.rs=actual;
        t.acc=Math.round(((t.acc*(t.att-1))+actual)/t.att*10)/10;
        const c=ML.classify(t.acc,t.att,t.rs,t.diff);
        t.status=c.label;t.ws=c.ws;t.cs=c.cs;t.lsd=0;
        subName=sub.name;
      }
    }));
    ns.attempts.unshift({id:Date.now(),name:topic.name,sub:subName,pred,actual,diff,date:"Just Now"});
    const streaked=updStreak(ns);
    lsSave(fbUser?.email,streaked);
    dbSave(fbUser?.uid,streaked);
    setState(streaked);setActive(false);
    setResult({pred,actual,diff,correct,total:qs.length,myAns:{...ans}});
  };

  if(result)return(
    <div className="max-w-3xl mx-auto space-y-4 pb-20 md:pb-0 fade-up">
      <div className="glass rounded-2xl p-6 text-center border-t-4 border-t-indigo-500">
        <span className="text-xs font-bold uppercase tracking-wider text-indigo-400">Quiz Complete ✓</span>
        <h2 className="font-heading font-bold text-2xl text-slate-100 mt-1">{topic.name}</h2>
        <div className="grid grid-cols-3 gap-3 my-5">
          {[{l:"ML Predicted",v:`${result.pred}%`,c:"text-cyan-400"},{l:"Actual Score",v:`${result.actual}%`,c:"text-emerald-400"},{l:"Correct/Total",v:`${result.correct}/${result.total}`,c:"text-slate-200"}].map((k,i)=>(
            <div key={i} className="p-3 rounded-xl bg-slate-800/60 border border-slate-700"><p className="text-[10px] text-slate-400">{k.l}</p><p className={`text-2xl font-bold ${k.c} mt-0.5`}>{k.v}</p></div>
          ))}
        </div>
        <div className="p-3.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-xs text-indigo-200 text-left mb-4">
          <strong className="text-indigo-300">🤖 AI Feedback: </strong>
          {result.actual>=85?"Excellent! You're mastering this topic. Move to harder content.":result.actual>=65?"Good progress! Review weak areas and revisit in 2 days.":"This topic needs intensive revision. Study notes carefully before retaking."}
          {" "}Profile auto-synced to Firebase.
        </div>
        <div className="flex gap-3 justify-center">
          <button onClick={()=>setShowExp(!showExp)} className="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold">{showExp?"Hide":"Show"} Explanations</button>
          <button onClick={()=>setResult(null)} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">Take Another Quiz</button>
        </div>
      </div>
      {showExp&&<div className="space-y-3">
        {qs.map((q,i)=>{const ua=result.myAns[q.id];const ok=ua===q.ans;return(
          <div key={q.id} className={`glass rounded-xl p-4 border-l-4 ${ok?"border-l-emerald-500":"border-l-rose-500"}`}>
            <p className="text-[10px] text-slate-500 mb-0.5">Q{i+1} · {q.concept}</p>
            <p className="text-sm font-semibold text-slate-200 mb-2">{q.q}</p>
            <p className="text-xs text-emerald-300 mb-0.5">✓ Correct: <strong>{q.ans}. {q[q.ans.toLowerCase()]}</strong></p>
            {!ok&&ua&&<p className="text-xs text-rose-300 mb-1">✗ Your answer: <strong>{ua}. {q[ua.toLowerCase()]}</strong></p>}
            {!ua&&<p className="text-xs text-amber-300 mb-1">⏱ Time expired</p>}
            <p className="text-xs text-slate-400 bg-slate-900/60 p-2 rounded-lg">{q.exp}</p>
          </div>
        );})}
      </div>}
    </div>
  );

  if(active&&qs.length>0){
    const q=qs[qi];const last=qi===qs.length-1;
    return(
      <div className="max-w-3xl mx-auto pb-20 md:pb-0 fade-up">
        <div className="glass rounded-2xl p-4 mb-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs text-slate-400">Question <strong className="text-slate-200">{qi+1}</strong> of <strong>{qs.length}</strong> · <span className="text-cyan-400">Pred: {pred}%</span></span>
            <Timer key={tkey} secs={30} maxSecs={30} onExpire={expire}/>
          </div>
          <div className="w-full h-1.5 rounded-full bg-slate-800"><div className="h-full bg-indigo-500 rounded-full transition-all" style={{width:`${((qi+1)/qs.length)*100}%`}}/></div>
        </div>
        <div className="glass rounded-2xl p-6 mb-4">
          <p className="text-[10px] text-slate-500 mb-1">{q.concept}</p>
          <h3 className="font-heading font-bold text-lg text-slate-100 mb-5">{q.q}</h3>
          <div className="space-y-3">
            {["A","B","C","D"].map(k=>{
              const txt=q[k.toLowerCase()];if(!txt)return null;
              const sel=ans[q.id]===k;
              return(
                <button key={k} onClick={()=>setAns(a=>({...a,[q.id]:k}))}
                  className={`w-full text-left p-4 rounded-xl border text-sm font-medium transition-all ${sel?"bg-indigo-600/20 border-indigo-500 text-indigo-200":"bg-slate-800/40 border-slate-700/50 text-slate-300 hover:bg-slate-800 hover:border-slate-600"}`}>
                  <span className="font-bold mr-2 text-indigo-400">{k}.</span>{txt}
                </button>
              );
            })}
          </div>
        </div>
        <div className="flex justify-between">
          <button disabled={qi===0} onClick={()=>{setQi(c=>c-1);setTkey(k=>k+1);}} className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs disabled:opacity-40 border border-slate-700">← Prev</button>
          {last?<button onClick={submit} className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-bold">Submit ✓</button>
            :<button onClick={()=>{setQi(c=>c+1);setTkey(k=>k+1);}} className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Next →</button>}
        </div>
      </div>
    );
  }

  return(
    <div className="max-w-2xl mx-auto pb-20 md:pb-0 fade-up">
      <Hdr title="AI Adaptive Quiz" sub="30-second timer per question · ML score prediction · Firebase sync" setMOpen={setMOpen} onLogout={onLogout} streak={state.streak}/>
      <div className="glass rounded-2xl p-6 space-y-5">
        <div><label className="block text-xs font-semibold text-slate-300 mb-2">Select Topic</label>
          <select value={selId} onChange={e=>setSelId(parseInt(e.target.value))} className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
            {state.subjects.map(s=><optgroup key={s.id} label={`${s.code} — ${s.name}`}>{s.topics.map(t=><option key={t.id} value={t.id}>{t.name} [{t.status}]</option>)}</optgroup>)}
          </select>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20"><p className="text-xs text-slate-400 mb-1">ML Predicted Score</p><p className="text-2xl font-bold text-cyan-400">{pred}%</p></div>
          <div className="p-4 rounded-xl bg-slate-800/60 border border-slate-700"><p className="text-xs text-slate-400 mb-1">Questions Available</p><p className={`text-2xl font-bold ${hasQ?"text-emerald-400":"text-rose-400"}`}>{qs.length}</p></div>
        </div>
        {!hasQ&&<div className="p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-xs flex gap-2"><i data-lucide="alert-triangle" className="w-4 h-4 shrink-0"/>No questions for this topic yet. Select a topic with questions.</div>}
        <div className="p-4 rounded-xl bg-slate-800/60 border border-slate-700 text-xs text-slate-300 space-y-1">
          <p className="font-semibold text-slate-200 mb-1.5">📋 Quiz Rules</p>
          <p>⏱ 30 seconds per question — auto-advances on expire</p>
          <p>🎯 Updates your AI profile in real-time</p>
          <p>💾 Synced to Firebase instantly</p>
          <p>💡 Wrong answers show explanations after</p>
        </div>
        <button onClick={start} disabled={!hasQ} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-sm shadow-lg disabled:opacity-40 flex items-center justify-center gap-2">
          <i data-lucide="play" className="w-4 h-4 fill-white"/>Start Quiz — {qs.length} Questions
        </button>
      </div>
    </div>
  );
};

            <div className="flex items-center justify-between mb-3">
              <h4 className={`font-heading font-bold text-sm ${today?"text-indigo-300":"text-slate-200"}`}>{d}</h4>
              {today&&<span className="px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 text-[10px] font-bold border border-indigo-500/30">TODAY</span>}
            </div>
            {topics.length>0?(
              <div className="space-y-2">
                {topics.map((t,i)=>(
                  <div key={i} className="p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/40">
                    <p className="text-xs font-semibold text-slate-200 leading-snug">{t.name}</p>
                    <div className="flex items-center justify-between mt-1"><span className="text-[10px] text-indigo-400">{t.scode}</span><span className="text-[10px] text-slate-500">⏱ {t.dur}m</span></div>
                    <div className="mt-1"><Badge type={t.rev}/></div>
                  </div>
                ))}
                {today&&<button onClick={()=>setTab("quiz")} className="w-full py-2 rounded-xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 text-xs font-semibold hover:bg-indigo-600/30 transition-colors">Start Session →</button>}
              </div>
            ):<div className="text-center py-4"><p className="text-slate-500 text-xs">Rest Day 🌙</p></div>}
          </div>
        ))}
      </div>
    </div>
  );
};

// LEARNING PROFILE
const Profile=({state,user,profile,setMOpen,onLogout})=>{
  const rc=React.useRef(null);
  const subs=state.subjects.map(s=>({code:s.code,avg:Math.round(s.topics.reduce((a,t)=>a+t.acc,0)/s.topics.length)}));
  const all=state.subjects.flatMap(s=>s.topics);
  const totalAtt=all.reduce((a,t)=>a+t.att,0);
  const achs=getAchievements(state);
  const name=profile?.full_name||user?.displayName||"Student";
  const overallAvg=Math.round(all.reduce((a,t)=>a+t.acc,0)/all.length);

  React.useEffect(()=>{
    if(window.lucide)lucide.createIcons();
    if(!window.Chart)return;
    const ctx=document.getElementById("rc");
    if(!ctx)return;
    if(rc.current){rc.current.destroy();rc.current=null;}
    rc.current=new Chart(ctx,{type:"radar",
      data:{labels:subs.map(s=>s.code),datasets:[{label:"Mastery %",data:subs.map(s=>s.avg),backgroundColor:"rgba(99,102,241,.2)",borderColor:"#6366f1",pointBackgroundColor:"#818cf8",pointBorderColor:"#fff",borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:true,scales:{r:{min:0,max:100,ticks:{color:"#94a3b8",backdropColor:"transparent",stepSize:20},grid:{color:"rgba(255,255,255,.07)"},pointLabels:{color:"#e2e8f0",font:{size:12,weight:"bold"}}}},plugins:{legend:{display:false}}}
    });
  },[state]);

  return(
    <div className="pb-20 md:pb-0 fade-up">
      <Hdr title="Learning Profile" sub="Competency radar, achievements & history" setMOpen={setMOpen} onLogout={onLogout} streak={state.streak}/>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        {/* Card */}
        <div className="glass rounded-2xl p-6 text-center border-t-4 border-t-indigo-500">
          {profile?.photoURL?<img src={profile.photoURL} className="w-20 h-20 rounded-full mx-auto mb-3 border-2 border-indigo-500" alt=""/>:
            <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 text-white font-bold text-3xl flex items-center justify-center mx-auto mb-3 shadow-lg">{name[0]}</div>}
          <h3 className="font-heading font-bold text-xl text-slate-100">{name}</h3>
          <p className="text-xs text-indigo-300 mb-3">{user?.email}</p>
          <div className="space-y-2 text-xs text-left border-t border-slate-800 pt-3">
            {[{l:"Overall Accuracy",v:`${overallAvg}%`,c:"text-indigo-300"},{l:"Topics Studied",v:`${all.filter(t=>t.att>0).length}/${all.length}`,c:"text-emerald-300"},{l:"Total Attempts",v:totalAtt,c:"text-cyan-300"},{l:"Study Streak",v:`🔥 ${state.streak||0} days`,c:"text-orange-300"},{l:"College",v:profile?.college||"University",c:"text-slate-300"}].map((s,i)=>(
              <div key={i} className="flex justify-between"><span className="text-slate-400">{s.l}</span><span className={`font-bold ${s.c}`}>{s.v}</span></div>
            ))}
          </div>
        </div>
        {/* Radar */}
        <div className="glass rounded-2xl p-5">
          <h4 className="font-heading font-bold text-sm text-slate-200 mb-4 text-center">Subject Mastery Radar</h4>
          <div className="max-w-xs mx-auto"><canvas id="rc"/></div>
          <div className="grid grid-cols-2 gap-2 mt-4">
            {subs.map(s=>(
              <div key={s.code} className="p-2 rounded-lg bg-slate-800/60 border border-slate-700 text-center">
                <p className="text-[10px] text-slate-400">{s.code}</p>
                <p className={`text-sm font-bold ${s.avg>=75?"text-emerald-400":s.avg>=55?"text-indigo-400":"text-rose-400"}`}>{s.avg}%</p>
              </div>
            ))}
          </div>
        </div>
        {/* Achievements */}
        <div className="glass rounded-2xl p-5">
          <h4 className="font-heading font-bold text-sm text-slate-200 mb-4 flex items-center gap-2">🏆 Achievements <span className="text-xs text-slate-400 font-normal">({achs.length})</span></h4>
          {achs.length===0?(
            <div className="text-center py-8"><p className="text-4xl mb-2">🎯</p><p className="text-slate-400 text-sm">Complete quizzes to unlock badges!</p></div>
          ):(
            <div className="space-y-2">
              {achs.map(a=>(
                <div key={a.id} className="flex items-center gap-3 p-3 rounded-xl bg-slate-800/60 border border-slate-700/40">
                  <span className="text-xl">{a.name.split(" ")[0]}</span>
                  <div><p className="text-xs font-bold text-slate-200">{a.name}</p><p className="text-[10px] text-slate-400">{a.desc}</p></div>
                  <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400 ml-auto shrink-0"/>
                </div>
              ))}
            </div>
          )}
          <div className="mt-4 pt-3 border-t border-slate-800"><p className="text-[10px] text-slate-500 uppercase tracking-wider mb-2">Locked</p>

                <span key={i} className="px-2 py-1 rounded-lg bg-slate-800/40 border border-slate-700/40 text-slate-600 text-[10px] font-medium grayscale">{b.ic} {b.n}</span>

          <h4 className="font-heading font-bold text-sm text-slate-200 mb-3">Recent Quiz History</h4>
          <div className="space-y-2">
            {state.attempts.slice(0,5).map((a,i)=>(
              <div key={a.id||i} className="flex items-center justify-between p-3 rounded-xl bg-slate-800/40 border border-slate-700/40 text-xs">
                <div><p className="font-semibold text-slate-200">{a.name}</p><p className="text-slate-500">{a.date}</p></div>
                <div className="flex items-center gap-3">
                  <span className="text-slate-400">Pred: <strong className="text-cyan-400">{a.pred}%</strong></span>
                  <span className={`font-bold text-base ${a.actual>=75?"text-emerald-400":a.actual>=55?"text-amber-400":"text-rose-400"}`}>{a.actual}%</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

// ACCOUNT PAGE
const Account=({state,setState,user,profile,setProfile,fbUser,setMOpen,onLogout})=>{
  const [fn,setFn]=React.useState(profile?.full_name||user?.displayName||"");
  const [cl,setCl]=React.useState(profile?.college||"");
  const [cr,setCr]=React.useState(profile?.course||"B.Tech Computer Science");
  const [sem,setSem]=React.useState(profile?.semester||"Semester 4");
  const [gpa,setGpa]=React.useState(profile?.target_gpa||3.9);
  const [ok,setOk]=React.useState(false);
  const [saving,setSaving]=React.useState(false);
  React.useEffect(()=>{if(window.lucide)lucide.createIcons();},[ok]);

  const save=async e=>{
    e.preventDefault();setSaving(true);
    const p={...profile,full_name:fn,college:cl,course:cr,semester:sem,target_gpa:parseFloat(gpa)||3.8};
    setProfile(p);
    if(fbUser?.uid)await fbDb.collection('users').doc(fbUser.uid).set({profile:p},{merge:true});
    setOk(true);setSaving(false);setTimeout(()=>setOk(false),3000);
  };

  const name=fn||user?.displayName||"Student";
  return(
    <div className="max-w-4xl mx-auto pb-20 md:pb-0 fade-up">
      <Hdr title="My Account" sub="Manage your profile synced to Firebase" setMOpen={setMOpen} onLogout={onLogout} streak={state.streak}/>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div className="glass rounded-2xl p-6 text-center border-t-4 border-t-indigo-500">
          {profile?.photoURL?<img src={profile.photoURL} className="w-20 h-20 rounded-full mx-auto mb-3 border-2 border-indigo-500" alt=""/>:
            <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 text-white font-bold text-3xl flex items-center justify-center mx-auto mb-3 shadow-lg">{name[0]}</div>}
          <h3 className="font-heading font-bold text-xl text-slate-100">{name}</h3>
          <p className="text-xs text-indigo-300 mb-3">{user?.email}</p>
          <div className="space-y-2 text-xs text-left border-t border-slate-800 pt-3">
            {[{l:"Auth",v:user?.providerData?.[0]?.providerId==="google.com"?"Google OAuth":"Email/Password"},{l:"Semester",v:sem},{l:"Target GPA",v:`${gpa}/4.0`},{l:"Streak",v:`🔥 ${state.streak||0} days`}].map((s,i)=>(
              <div key={i} className="flex justify-between"><span className="text-slate-400">{s.l}:</span><span className="text-slate-200 font-semibold">{s.v}</span></div>
            ))}
          </div>
          <button onClick={onLogout} className="w-full mt-4 py-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 font-semibold text-xs flex items-center justify-center gap-2">
            <i data-lucide="log-out" className="w-4 h-4"/>Sign Out
          </button>
        </div>
        <div className="md:col-span-2 glass rounded-2xl p-6">
          <h4 className="font-heading font-bold text-lg text-slate-100 mb-4 pb-2 border-b border-slate-800">Profile Settings</h4>
          {ok&&<div className="mb-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs flex gap-2"><i data-lucide="check-circle" className="w-4 h-4"/>Profile saved & synced to Firebase!</div>}
          <form onSubmit={save} className="space-y-4">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {[{l:"Full Name",v:fn,set:setFn,t:"text"},{l:"Email (readonly)",v:user?.email||"",t:"email",ro:true}].map(f=>(
                <div key={f.l}><label className="block text-xs font-semibold text-slate-300 mb-1.5">{f.l}</label>
                  <input type={f.t} value={f.v} onChange={f.ro?undefined:e=>f.set(e.target.value)} readOnly={f.ro}
                    className={`w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-sm focus:outline-none focus:border-indigo-500 ${f.ro?"text-slate-500 cursor-not-allowed":"text-slate-200"}`}/></div>
              ))}
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label className="block text-xs font-semibold text-slate-300 mb-1.5">College/University</label>
                <input type="text" value={cl} onChange={e=>setCl(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"/></div>
              <div><label className="block text-xs font-semibold text-slate-300 mb-1.5">Course</label>
                <input type="text" value={cr} onChange={e=>setCr(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"/></div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label className="block text-xs font-semibold text-slate-300 mb-1.5">Semester</label>
                <select value={sem} onChange={e=>setSem(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                  {[1,2,3,4,5,6,7,8].map(n=><option key={n} value={`Semester ${n}`}>Semester {n}</option>)}
                </select></div>
              <div><label className="block text-xs font-semibold text-slate-300 mb-1.5">Target GPA</label>
                <input type="number" step="0.1" min="1" max="4" value={gpa} onChange={e=>setGpa(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"/></div>
            </div>
            <button type="submit" disabled={saving} className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg disabled:opacity-50 flex items-center gap-2">
              {saving?<><div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full spin"/>Saving...</>:"Save & Sync to Firebase"}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
};

// ── ROOT APP ─────────────────────────────────────────────────────────────────
const App=()=>{
  const [fbUser,setFbUser]=React.useState(undefined); // undefined=loading
  const [profile,setProfile]=React.useState(null);
  const [state,setState]=React.useState(null);
  const [tab,setTab]=React.useState("dashboard");
  const [mOpen,setMOpen]=React.useState(false);

  React.useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(async u=>{
      if(u){
        setFbUser(u);
        // Load profile from Firestore
        try{const doc=await fbDb.collection('users').doc(u.uid).get();
          if(doc.exists&&doc.data().profile)setProfile(doc.data().profile);
          else setProfile({full_name:u.displayName||u.email?.split("@")[0]||"Student",email:u.email});
        }catch(e){setProfile({full_name:u.displayName||"Student",email:u.email});}
        // Load study data
        const cloud=await fsLoad(u.uid);
        if(cloud){setState(cloud);lsSave(u.email,cloud);}
        else{const local=lsLoad(u.email);setState(local);}
        // Update streak on login
        setState(prev=>{if(!prev)return prev;const s=updStreak(prev);lsSave(u.email,s);dbSave(u.uid,s);return s;});
      }else{setFbUser(null);setState(null);setProfile(null);}
    });
    return unsub;
  },[]);

  const handleLogin=async(u,p)=>{
    setFbUser(u);setProfile(p||{full_name:u.displayName||"Student",email:u.email});
    const cloud=await fsLoad(u.uid);
    if(cloud){setState(cloud);lsSave(u.email,cloud);}
    else{const local=lsLoad(u.email);setState(local);}
    setState(prev=>{if(!prev)return prev;const s=updStreak(prev);lsSave(u.email,s);dbSave(u.uid,s);return s;});
  };

  const handleLogout=()=>{fbAuth.signOut();setFbUser(null);setState(null);setProfile(null);};

  if(fbUser===undefined)return <Splash/>;
  if(!fbUser)return <AuthPage onLogin={handleLogin}/>;
  if(!state)return <Splash/>;

  const props={state,setState:ns=>{setState(ns);lsSave(fbUser.email,ns);dbSave(fbUser.uid,ns);},setMOpen,onLogout:handleLogout,streak:state.streak||0};
  const pageMap={
    dashboard:<Dashboard {...props} profile={profile} setTab={setTab}/>,
    subjects:<Subjects {...props} setTab={setTab}/>,
    notes:<Notes {...props}/>,
    plan:<Plan {...props} setTab={setTab}/>,
    quiz:<Quiz {...props} fbUser={fbUser}/>,
    perf:<Perf {...props}/>,
    recs:<Recs {...props}/>,
    profile:<Profile {...props} user={fbUser} profile={profile}/>,
    account:<Account {...props} user={fbUser} profile={profile} setProfile={setProfile} fbUser={fbUser}/>
  };

  return(
    <div className="min-h-screen bg-slate-950 text-slate-100 flex">
      <Sidebar active={tab} setActive={setTab} user={fbUser} profile={profile} streak={state.streak||0} mOpen={mOpen} setMOpen={setMOpen} onLogout={handleLogout}/>
      <main className="md:ml-64 flex-1 p-4 sm:p-7 overflow-y-auto min-h-screen">
        {pageMap[tab]||pageMap.dashboard}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
