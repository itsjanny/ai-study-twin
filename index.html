    const ClientMLEngine = {
      // Model 1: Weak Topic Classifier
      classifyTopic: (accuracy, attempts, recent_score, difficulty) => {
        const eff_acc = attempts > 0 ? (recent_score * 0.6 + accuracy * 0.4) : 50.0;
        const adj_score = eff_acc + (difficulty - 3) * 2.0;

        let label = "Average";
        if (adj_score >= 80.0) label = "Strong";
        else if (adj_score >= 60.0) label = "Average";
        else if (adj_score >= 40.0) label = "Weak";
        else label = "Very Weak";

        return {
          label,
          weakness_score: Math.round(Math.max(0, 100 - adj_score)),
          confidence_score: Math.round(Math.min(100, Math.max(10, adj_score)))
        };
      },

      // Model 2: Quiz Score Predictor (Regression Model)
      predictQuizScore: (topic) => {
        if (!topic) return 72.0;
        const base = (topic.recent_score * 0.45) + (topic.accuracy * 0.4) + (topic.confidence_score * 0.15);
        const decay = Math.min(15, (topic.last_studied_days || 3) * 0.8);
        const diff_penalty = (topic.difficulty - 3) * 2.5;
        const pred = base - decay - diff_penalty;
        return Math.round(Math.max(15, Math.min(98, pred)) * 10) / 10;
      },

      // Model 3: Hybrid Recommendation Engine
      generateRecommendations: (state) => {
        const recs = [];
        state.subjects.forEach(sub => {
          sub.topics.forEach(top => {
            const time_factor = Math.min(30, (top.last_studied_days || 1) * 1.5);
            const p_score = (top.weakness_score * 0.45) + time_factor + (top.difficulty * 3.0) + (top.importance * 10.0);

            let rev_req = "Light Maintenance";
            let duration = 10;
            if (top.status === "Very Weak" || top.last_studied_days > 10) {
              rev_req = "High (Intensive)";
              duration = 45;
            } else if (top.status === "Weak" || top.last_studied_days > 6) {
              rev_req = "Medium (Focused)";
              duration = 30;
            } else if (top.status === "Average") {
              rev_req = "Moderate";
              duration = 20;
            }

            let reason = `${sub.code} — ${top.name} is a '${top.status}' area with low recent accuracy (${top.recent_score}%). Focus on targeted revision.`;
            if (top.last_studied_days > 7) {
              reason = `${top.name} has not been studied in ${top.last_studied_days} days. Scheduled for memory retention.`;
            }

            recs.push({
              topic_id: top.id,
              topic_name: top.name,
              subject_name: sub.name,
              priority_score: Math.round(p_score * 10) / 10,
              reason: reason,
              revision_required: rev_req,
              recommended_duration_min: duration
            });
          });
        });

        recs.sort((a, b) => b.priority_score - a.priority_score);
        return recs.map((r, idx) => ({ ...r, priority_rank: idx + 1 }));
      }
    };

      const [selectedAnswers, setSelectedAnswers] = React.useState({});
      const [quizActive, setQuizActive] = React.useState(false);
      const [result, setResult] = React.useState(null);

      const selectedTopic = allTopics.find(t => t.id === selectedTopicId) || allTopics[0];
      const predictedScore = ClientMLEngine.predictQuizScore(selectedTopic);

      const topicQuestions = state.questions.filter(q => q.topic_id === selectedTopicId);
      const questionsList = topicQuestions.length > 0 ? topicQuestions : state.questions;

      const startQuiz = () => {
        setResult(null);
        setSelectedAnswers({});
        setCurrentQIndex(0);
        setQuizActive(true);
      };

      const submitQuiz = () => {
        let correctCount = 0;
        questionsList.forEach(q => {
          if (selectedAnswers[q.id] === q.correct) correctCount++;
        });

        const actualScore = Math.round((correctCount / questionsList.length) * 100);
        const scoreDiff = Math.round((actualScore - predictedScore) * 10) / 10;

        // Update ML Topic Performance in State
        const updatedState = { ...state };
        updatedState.subjects.forEach(sub => {
          sub.topics.forEach(top => {
            if (top.id === selectedTopicId) {
              top.attempts += 1;
              top.recent_score = actualScore;
              top.accuracy = Math.round((top.accuracy * (top.attempts - 1) + actualScore) / top.attempts);

              const classification = ClientMLEngine.classifyTopic(top.accuracy, top.attempts, top.recent_score, top.difficulty);
              top.status = classification.label;
              top.weakness_score = classification.weakness_score;
              top.confidence_score = classification.confidence_score;
              top.last_studied_days = 0;
            }
          });
        });

        updatedState.attempts.unshift({
          id: Date.now(),
          topic_name: selectedTopic.name,
          subject_name: "Computer Science",
          predicted: predictedScore,
          actual: actualScore,
          diff: scoreDiff,
          date: "Just Now"
        });

        saveState(updatedState);
        setState(updatedState);
        setQuizActive(false);

        setResult({
          predicted: predictedScore,
          actual: actualScore,
          diff: scoreDiff,
          correct: correctCount,
          total: questionsList.length
        });

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Identity Card */}
            <div className="glass-card rounded-2xl p-6 text-center border-t-4 border-t-emerald-500">
              <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 text-white font-bold text-3xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/30">
                {fullName?.charAt(0) || "S"}
              </div>
              <h3 className="font-heading font-bold text-xl text-slate-100">{fullName}</h3>
              <p className="text-xs text-emerald-300 font-medium mt-0.5">{user.email}</p>
              <div className="mt-4 pt-4 border-t border-slate-800 text-left space-y-2 text-xs">
                <div className="flex justify-between">
                  <span className="text-slate-400">Account Role:</span>
                  <span className="text-emerald-400 font-semibold">Active Student</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Current Semester:</span>
                  <span className="text-slate-200 font-semibold">{semester}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Target GPA:</span>
                  <span className="text-cyan-400 font-bold">{targetGpa} / 4.0</span>
                </div>
              </div>

              <button
                onClick={onLogout}
                className="w-full mt-6 py-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 font-semibold text-xs transition-colors flex items-center justify-center gap-2"
              >
                <i data-lucide="log-out" className="w-4 h-4"></i>
                <span>Log Out & Switch Credentials</span>
              </button>
            </div>

            {/* Credentials & Details Form */}
            <div className="md:col-span-2 glass-card rounded-2xl p-6">
              <h4 className="font-heading font-bold text-lg text-slate-100 mb-4 pb-2 border-b border-slate-800">
                Academic Profile Settings
              </h4>

              {savedNotice && (
                <div className="mb-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs flex items-center gap-2">
                  <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400"></i>
                  <span>Profile & credentials updated successfully!</span>
                </div>
              )}

              <form onSubmit={handleSave} className="space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
                    <input
                      type="text"
                      value={fullName}
                      onChange={e => setFullName(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                    <input
                      type="email"
                      disabled
                      value={user.email || ""}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/50 border border-slate-800 text-slate-500 text-sm cursor-not-allowed"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">College / Institution</label>
                    <input
                      type="text"
                      value={college}
                      onChange={e => setCollege(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Course / Degree</label>
                    <input
                      type="text"
                      value={course}
                      onChange={e => setCourse(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Semester</label>
                    <select
                      value={semester}
                      onChange={e => setSemester(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-emerald-500"
                    >
                      <option value="Semester 1">Semester 1</option>
                      <option value="Semester 2">Semester 2</option>
                      <option value="Semester 3">Semester 3</option>
                      <option value="Semester 4">Semester 4</option>
                      <option value="Semester 5">Semester 5</option>
                      <option value="Semester 6">Semester 6</option>
                      <option value="Semester 7">Semester 7</option>
                      <option value="Semester 8">Semester 8</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Target GPA</label>
                    <input
                      type="number"
                      step="0.1"
                      min="1.0"
                      max="4.0"
                      value={targetGpa}
                      onChange={e => setTargetGpa(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/30 transition-colors"
                >
                  Save Profile Changes
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    // MAIN ROOT COMPONENT
    const App = () => {
      const [currentUser, setCurrentUser] = React.useState(loadSession());
      const [state, setState] = React.useState(loadState());
      const [activeTab, setActiveTab] = React.useState("dashboard");
      const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

      const handleLoginSuccess = (user) => {
        saveSession(user);
        setCurrentUser(user);

        const updatedState = { ...state, user: user };
        saveState(updatedState);
        setState(updatedState);
      };

      const handleLogout = () => {
        saveSession(null);
        setCurrentUser(null);
      };

      if (!currentUser) {
        return <AuthPage onLoginSuccess={handleLoginSuccess} />;
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col md:flex-row">
          <Sidebar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            user={currentUser}
            mobileMenuOpen={mobileMenuOpen}
            setMobileMenuOpen={setMobileMenuOpen}
            onLogout={handleLogout}
          />
          <main className="md:ml-64 flex-1 p-4 sm:p-8 overflow-y-auto">
            {activeTab === "dashboard" && <DashboardPage state={state} setActiveTab={setActiveTab} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
            {activeTab === "subjects" && <SubjectsPage state={state} setActiveTab={setActiveTab} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
            {activeTab === "study-material" && <StudyMaterialPage state={state} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
            {activeTab === "take-quiz" && <TakeQuizPage state={state} setState={setState} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
            {activeTab === "recommendations" && <RecommendationsPage state={state} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
            {activeTab === "performance" && <PerformancePage state={state} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
            {activeTab === "study-plan" && <RecommendationsPage state={state} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
            {activeTab === "learning-profile" && <PerformancePage state={state} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
            {activeTab === "profile" && <StudentProfilePage state={state} setState={setState} setMobileMenuOpen={setMobileMenuOpen} onLogout={handleLogout} />}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
