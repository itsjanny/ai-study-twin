            { id: 302, name: "Database Normalization", difficulty: 4, importance: 1.4, status: "Weak", accuracy: 52.0, attempts: 2, recent_score: 48.0, weakness_score: 50.0, confidence_score: 50.0, last_studied_days: 6 },
            { id: 303, name: "ACID Properties & Transactions", difficulty: 3, importance: 1.5, status: "Strong", accuracy: 88.0, attempts: 4, recent_score: 90.0, weakness_score: 12.0, confidence_score: 88.0, last_studied_days: 1 }

      questions: [
        { id: 1, topic_id: 105, question: "What distinguishes Method Overriding from Method Overloading in Java?", a: "Overriding occurs in the same class; Overloading requires inheritance.", b: "Overriding involves runtime dynamic dispatch with identical method signature in a subclass.", c: "Overloading changes the return type only.", d: "There is no difference.", correct: "B", explanation: "Method Overriding happens at runtime (Dynamic Binding) when a child class redefines a parent method with exact matching arguments.", concept: "Dynamic Dispatch" },
        { id: 2, topic_id: 105, question: "What happens if you try to override a method marked as 'final' in Java?", a: "Compiler error occurs.", b: "Runtime exception is thrown.", c: "Method is hidden.", d: "Code executes normally.", correct: "A", explanation: "Methods marked 'final' cannot be overridden by subclasses; attempting to do so produces a compilation failure.", concept: "Final Specifier" },
        { id: 3, topic_id: 106, question: "Which block is guaranteed to execute regardless of whether an exception is caught or thrown?", a: "try", b: "catch", c: "finally", d: "throws", correct: "C", explanation: "The 'finally' block always executes after try/catch, making it ideal for cleanup like closing resource connections.", concept: "Try-Catch-Finally" },

        { id: 5, topic_id: 203, question: "What is the worst-case time complexity of QuickSort when a poor pivot is chosen repeatedly?", a: "O(N log N)", b: "O(N^2)", c: "O(N)", d: "O(log N)", correct: "B", explanation: "When an array is already sorted and the extreme element is selected as pivot, QuickSort degrades to O(N^2).", concept: "Sorting Complexity" }
      ],
      attempts: [
        { id: 1, topic_name: "Polymorphism & Overriding", subject_name: "Object Oriented Programming", predicted: 52.0, actual: 40.0, diff: -12.0, date: "Yesterday" },
        { id: 2, topic_name: "Variables & Data Types", subject_name: "Object Oriented Programming", predicted: 88.0, actual: 92.0, diff: +4.0, date: "3 days ago" }
      ]
    };

    function loadState() {
      const saved = localStorage.getItem("aistudytwin_data");
      if (!saved) {
        localStorage.setItem("aistudytwin_data", JSON.stringify(DEFAULT_DATA));
        return DEFAULT_DATA;
      }
      return JSON.parse(saved);
    }

    function saveState(data) {
      localStorage.setItem("aistudytwin_data", JSON.stringify(data));
    }

    // ==========================================
    // CLIENT-SIDE AI / ML ENGINES (MODELS 1, 2, 3)
    // ==========================================
    const ClientMLEngine = {
      // Model 1: Weak Topic Classifier
      classifyTopic: (accuracy, attempts, recent_score, difficulty) => {
        const eff_acc = attempts > 0 ? (recent_score * 0.6 + accuracy * 0.4) : 50.0;
        const adj_score = eff_acc + (difficulty - 3) * 2.0;

        let label = "Average";
        if (adj_score >= 80.0) label = "Strong";
        else if (adj_score >= 60.0) label = "Average";
        else if (adj_score >= 40.0) label = "Weak";
        else label = "Very Weak";

        return {
          label,
          weakness_score: Math.round(Math.max(0, 100 - adj_score)),
          confidence_score: Math.round(Math.min(100, Math.max(10, adj_score)))
        };
      },

      // Model 2: Quiz Score Predictor (Regression Model)
      predictQuizScore: (topic) => {
        if (!topic) return 72.0;
        const base = (topic.recent_score * 0.45) + (topic.accuracy * 0.4) + (topic.confidence_score * 0.15);
        const decay = Math.min(15, (topic.last_studied_days || 3) * 0.8);
        const diff_penalty = (topic.difficulty - 3) * 2.5;
        const pred = base - decay - diff_penalty;
        return Math.round(Math.max(15, Math.min(98, pred)) * 10) / 10;
      },

      // Model 3: Hybrid Recommendation Engine
      generateRecommendations: (state) => {
        const recs = [];
        state.subjects.forEach(sub => {
          sub.topics.forEach(top => {
            const time_factor = Math.min(30, (top.last_studied_days || 1) * 1.5);
            const p_score = (top.weakness_score * 0.45) + time_factor + (top.difficulty * 3.0) + (top.importance * 10.0);

            let rev_req = "Light Maintenance";
            let duration = 10;
            if (top.status === "Very Weak" || top.last_studied_days > 10) {
              rev_req = "High (Intensive)";
              duration = 45;
            } else if (top.status === "Weak" || top.last_studied_days > 6) {
              rev_req = "Medium (Focused)";
              duration = 30;
            } else if (top.status === "Average") {
              rev_req = "Moderate";
              duration = 20;
            }

            let reason = `${sub.code} — ${top.name} is a '${top.status}' area with low recent accuracy (${top.recent_score}%). Focus on targeted revision.`;
            if (top.last_studied_days > 7) {
              reason = `${top.name} has not been studied in ${top.last_studied_days} days. Scheduled for memory retention.`;
            }

            recs.push({
              topic_id: top.id,
              topic_name: top.name,
              subject_name: sub.name,
              priority_score: Math.round(p_score * 10) / 10,
              reason: reason,
              revision_required: rev_req,
              recommended_duration_min: duration
            });
          });
        });

        recs.sort((a, b) => b.priority_score - a.priority_score);
        return recs.map((r, idx) => ({ ...r, priority_rank: idx + 1 }));
      }
    };

    // ==========================================
    // UI COMPONENTS & PAGES
    // ==========================================

    const Header = ({ title, subtitle, setMobileMenuOpen }) => {

          </div>

          </div>

    // DASHBOARD PAGE
    const DashboardPage = ({ state, setActiveTab, setMobileMenuOpen }) => {
      const trendChartRef = React.useRef(null);
      const subjChartRef = React.useRef(null);

      const allTopics = state.subjects.flatMap(s => s.topics);
      const totalTopics = allTopics.length;
      const mastered = allTopics.filter(t => t.status === "Strong");

              plugins: { legend: { display: false } },

            <div className="glass-card rounded-2xl p-4">

              <h3 className="text-xl sm:text-2xl font-bold font-heading text-slate-100 mt-1">{avgAccuracy}%</h3>
              <p className="text-[10px] sm:text-xs text-emerald-400 font-medium mt-1">Level: Intermediate</p>
            </div>
            <div className="glass-card rounded-2xl p-4">
              <p className="text-[10px] sm:text-xs font-semibold text-slate-400">Topics Mastered</p>
              <h3 className="text-xl sm:text-2xl font-bold font-heading text-emerald-400 mt-1">{mastered.length}</h3>
              <p className="text-[10px] sm:text-xs text-slate-400 mt-1">Score 80%+</p>
            </div>
            <div className="glass-card rounded-2xl p-4">
              <p className="text-[10px] sm:text-xs font-semibold text-slate-400">Needs Revision</p>
              <h3 className="text-xl sm:text-2xl font-bold font-heading text-rose-400 mt-1">{weak.length}</h3>
              <p className="text-[10px] sm:text-xs text-amber-400 mt-1">High Focus</p>
            </div>
            <div className="glass-card rounded-2xl p-4">
              <p className="text-[10px] sm:text-xs font-semibold text-slate-400">ML Predicted Next</p>
              <h3 className="text-xl sm:text-2xl font-bold font-heading text-cyan-400 mt-1">{predictedNext}%</h3>
              <p className="text-[10px] sm:text-xs text-slate-400 mt-1">Score Predictor</p>
            </div>
          </div>

          {/* AI Banner */}
          <div className="glass-card rounded-2xl p-5 mb-6 border-l-4 border-l-indigo-500 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-start gap-4">
              <div className="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">
                <i data-lucide="sparkles" className="w-5 h-5"></i>
              </div>
              <div>
                <span className="text-xs font-semibold uppercase tracking-wider text-indigo-400">Top Recommendation</span>
                <h4 className="font-heading font-bold text-base sm:text-lg text-slate-100 mt-0.5">
                  Recommended Study Focus: <span className="text-indigo-300">{topRec.topic_name}</span>
                </h4>
                <p className="text-xs text-slate-300 mt-1">{topRec.reason}</p>
              </div>
            </div>
            <button
              onClick={() => setActiveTab("take-quiz")}
              className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold text-xs sm:text-sm shadow-lg flex items-center justify-center gap-2 shrink-0"
            >
              <span>Start Diagnostic Quiz</span>
              <i data-lucide="arrow-right" className="w-4 h-4"></i>
            </button>
          </div>

          {/* Charts */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div className="glass-card rounded-2xl p-5">
              <h4 className="font-heading font-semibold text-slate-200 mb-4">Performance Trend</h4>
              <div className="h-64"><canvas id="trendChart"></canvas></div>
            </div>
            <div className="glass-card rounded-2xl p-5">
              <h4 className="font-heading font-semibold text-slate-200 mb-4">Subject Comparison</h4>
              <div className="h-64"><canvas id="subjChart"></canvas></div>
            </div>
          </div>
        </div>
      );
    };

    // SUBJECTS PAGE
    const SubjectsPage = ({ state, setActiveTab, setMobileMenuOpen }) => {
      return (
        <div className="pb-16 md:pb-0">
          <Header title="My Enrolled Subjects" subtitle="Explore curriculum topics and baseline strength" setMobileMenuOpen={setMobileMenuOpen} />
          <div className="space-y-6">
            {state.subjects.map(sub => (
              <div key={sub.id} className="glass-card rounded-2xl p-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4 pb-4 border-b border-slate-800">
                  <div>
                    <span className="px-2.5 py-1 rounded-md bg-indigo-500/10 text-indigo-400 font-mono text-xs font-bold border border-indigo-500/20">{sub.code}</span>
                    <h3 className="font-heading font-bold text-xl text-slate-100 mt-2">{sub.name}</h3>
                    <p className="text-xs text-slate-400 mt-1">{sub.description}</p>
                  </div>
                  <button onClick={() => setActiveTab("take-quiz")} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center gap-2 self-start sm:self-auto">
                    <span>Take Quiz</span>
                    <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                  </button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {sub.topics.map(top => (
                    <div key={top.id} className="p-4 rounded-xl bg-slate-800/40 border border-slate-700/40">
                      <div className="flex items-start justify-between gap-2 mb-2">
                        <h4 className="font-semibold text-sm text-slate-200">{top.name}</h4>
                        <Badge type={top.status} />
                      </div>
                      <div className="flex justify-between text-xs mb-1">
                        <span className="text-slate-400">Accuracy</span>
                        <span className="font-semibold text-indigo-300">{top.accuracy}%</span>
                      </div>
                      <div className="w-full h-2 rounded-full bg-slate-700 overflow-hidden">
                        <div className="h-full bg-indigo-500 rounded-full" style={{ width: `${top.accuracy}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ADAPTIVE QUIZ PAGE
    const TakeQuizPage = ({ state, setState, setMobileMenuOpen }) => {
      const [selectedTopicId, setSelectedTopicId] = React.useState(105);
      const [currentQIndex, setCurrentQIndex] = React.useState(0);
      const [selectedAnswers, setSelectedAnswers] = React.useState({});
      const [quizActive, setQuizActive] = React.useState(false);
      const [result, setResult] = React.useState(null);

      const allTopics = state.subjects.flatMap(s => s.topics);
      const selectedTopic = allTopics.find(t => t.id === selectedTopicId) || allTopics[0];
      const predictedScore = ClientMLEngine.predictQuizScore(selectedTopic);

      const topicQuestions = state.questions.filter(q => q.topic_id === selectedTopicId);
      const questionsList = topicQuestions.length > 0 ? topicQuestions : state.questions;

      const startQuiz = () => {
        setResult(null);
        setSelectedAnswers({});
        setCurrentQIndex(0);
        setQuizActive(true);
      };

      const submitQuiz = () => {
        let correctCount = 0;
        questionsList.forEach(q => {
          if (selectedAnswers[q.id] === q.correct) correctCount++;
        });

        const actualScore = Math.round((correctCount / questionsList.length) * 100);
        const scoreDiff = Math.round((actualScore - predictedScore) * 10) / 10;

        // Update ML Topic Performance in State
        const updatedState = { ...state };
        updatedState.subjects.forEach(sub => {
          sub.topics.forEach(top => {
            if (top.id === selectedTopicId) {
              top.attempts += 1;
              top.recent_score = actualScore;
              top.accuracy = Math.round((top.accuracy * (top.attempts - 1) + actualScore) / top.attempts);

              const classification = ClientMLEngine.classifyTopic(top.accuracy, top.attempts, top.recent_score, top.difficulty);
              top.status = classification.label;
              top.weakness_score = classification.weakness_score;
              top.confidence_score = classification.confidence_score;
              top.last_studied_days = 0;
            }
          });
        });

        updatedState.attempts.unshift({
          id: Date.now(),
          topic_name: selectedTopic.name,
          subject_name: "Computer Science",
          predicted: predictedScore,
          actual: actualScore,
          diff: scoreDiff,
          date: "Just Now"
        });

        saveState(updatedState);
        setState(updatedState);
        setQuizActive(false);

        setResult({
          predicted: predictedScore,
          actual: actualScore,
          diff: scoreDiff,
          correct: correctCount,
          total: questionsList.length
        });
      };

      if (result) {
        return (
          <div className="max-w-3xl mx-auto space-y-6 pb-16 md:pb-0">
            <div className="glass-card rounded-2xl p-6 text-center border-t-4 border-t-indigo-500">
              <span className="text-xs font-semibold uppercase tracking-wider text-indigo-400">Quiz Completed</span>
              <h2 className="font-heading font-bold text-3xl text-slate-100 mt-1">Predicted vs Actual Comparison</h2>

              <div className="grid grid-cols-3 gap-3 my-6">
                <div className="p-3 rounded-xl bg-slate-800/60 border border-slate-700">
                  <p className="text-[10px] text-slate-400">ML Predicted</p>
                  <p className="text-xl sm:text-2xl font-bold font-heading text-cyan-400 mt-1">{result.predicted}%</p>
                </div>
                <div className="p-3 rounded-xl bg-slate-800/60 border border-indigo-500/40">
                  <p className="text-[10px] text-slate-400">Actual Score</p>
                  <p className="text-2xl sm:text-3xl font-bold font-heading text-emerald-400 mt-1">{result.actual}%</p>
                </div>
                <div className="p-3 rounded-xl bg-slate-800/60 border border-slate-700">
                  <p className="text-[10px] text-slate-400">Prediction Diff</p>
                  <p className={`text-xl sm:text-2xl font-bold font-heading mt-1 ${result.diff >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                    {result.diff >= 0 ? `+${result.diff}%` : `${result.diff}%`}
                  </p>
                </div>
              </div>

              <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-left text-xs text-indigo-200">
                <strong className="block text-indigo-300 font-semibold mb-1">AI Twin Feedback & Profile Auto-Sync:</strong>
                Your learning profile was updated! The weakness classifier re-scored {selectedTopic.name} and adjusted your study priority queue.
              </div>

              <button onClick={() => setResult(null)} className="mt-6 px-6 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">
                Take Another Quiz
              </button>
            </div>
          </div>
        );
      }

      if (quizActive) {
        const q = questionsList[currentQIndex];
        const isLast = currentQIndex === questionsList.length - 1;
        return (
          <div className="max-w-3xl mx-auto pb-16 md:pb-0">
            <div className="glass-card rounded-2xl p-4 mb-4 flex justify-between items-center text-xs">
              <div>
                <span className="text-slate-400">Topic:</span> <strong className="text-slate-200">{selectedTopic.name}</strong>
              </div>
              <div className="text-cyan-400 font-bold">Predicted Score: {predictedScore}%</div>
            </div>

            <div className="glass-card rounded-2xl p-6 mb-6">
              <span className="text-xs text-slate-400 block mb-2">Question {currentQIndex + 1} of {questionsList.length}</span>
              <h3 className="font-heading font-bold text-lg text-slate-100 mb-6">{q.question}</h3>

              <div className="space-y-3">
                {["A", "B", "C", "D"].map(optKey => {
                  const optText = q[optKey.toLowerCase()];
                  const isSel = selectedAnswers[q.id] === optKey;
                  return (
                    <button
                      key={optKey}
                      onClick={() => setSelectedAnswers({ ...selectedAnswers, [q.id]: optKey })}
                      className={`w-full text-left p-4 rounded-xl border text-sm font-medium transition-all ${
                        isSel ? "bg-indigo-600/20 border-indigo-500 text-indigo-200" : "bg-slate-800/40 border-slate-700/60 text-slate-300"
                      }`}
                    >
                      <span className="font-bold mr-3">{optKey}.</span> {optText}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="flex justify-between">
              <button disabled={currentQIndex === 0} onClick={() => setCurrentQIndex(c => c - 1)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs">Previous</button>
              {isLast ? (
                <button onClick={submitQuiz} className="px-6 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Submit Quiz</button>
              ) : (
                <button onClick={() => setCurrentQIndex(c => c + 1)} className="px-6 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Next</button>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto pb-16 md:pb-0">
          <Header title="AI Adaptive Quiz Generator" subtitle="Target your weak topics with live ML score prediction" setMobileMenuOpen={setMobileMenuOpen} />
          <div className="glass-card rounded-2xl p-6 space-y-4">
            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-2">Select Target Topic</label>
              <select
                value={selectedTopicId}
                onChange={e => setSelectedTopicId(parseInt(e.target.value))}
                className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
              >
                {allTopics.map(t => (
                  <option key={t.id} value={t.id}>{t.name} ({t.status})</option>
                ))}
              </select>
            </div>
            <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-xs text-indigo-200">
              <strong>ML Predicted Quiz Score:</strong> {predictedScore}%
            </div>
            <button onClick={startQuiz} className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-sm">
              Start Interactive Quiz
            </button>
          </div>
        </div>
      );
    };

    // AI RECOMMENDATIONS PAGE
    const RecommendationsPage = ({ state, setMobileMenuOpen }) => {
      const recs = ClientMLEngine.generateRecommendations(state);
      return (
        <div className="pb-16 md:pb-0">
          <Header title="AI Recommendation Engine" subtitle="Priority-ranked study topics with explicit reasoning" setMobileMenuOpen={setMobileMenuOpen} />
          <div className="space-y-4">
            {recs.map(item => (
              <div key={item.topic_id} className="glass-card rounded-2xl p-5 border-l-4 border-l-indigo-500 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-indigo-600/20 text-indigo-400 text-xs font-bold flex items-center justify-center">#{item.priority_rank}</span>
                    <h4 className="font-heading font-bold text-lg text-slate-100">{item.topic_name}</h4>
                    <Badge type={item.revision_required} />
                  </div>
                  <p className="text-xs text-indigo-300 font-semibold mt-1">{item.subject_name}</p>
                  <p className="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-lg border border-slate-800 mt-2">{item.reason}</p>
                </div>
                <div className="text-right shrink-0">
                  <span className="text-xs text-slate-400 block">Rec. Duration</span>
                  <span className="text-base font-bold text-emerald-400">{item.recommended_duration_min} mins</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // PERFORMANCE PAGE
    const PerformancePage = ({ state, setMobileMenuOpen }) => {
      const allTopics = state.subjects.flatMap(s => s.topics);
      return (
        <div className="pb-16 md:pb-0">
          <Header title="Performance Analytics" subtitle="Complete stored metrics per topic updated in real-time" setMobileMenuOpen={setMobileMenuOpen} />
          <div className="glass-card rounded-2xl p-5 overflow-x-auto">
            <table className="w-full text-left text-xs">
              <thead>
                <tr className="border-b border-slate-800 text-slate-400">
                  <th className="pb-3">Topic</th>
                  <th className="pb-3">Attempts</th>
                  <th className="pb-3">Accuracy</th>
                  <th className="pb-3">Weakness Score</th>
                  <th className="pb-3">Confidence Score</th>
                  <th className="pb-3">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800/50">
                {allTopics.map(t => (
                  <tr key={t.id} className="hover:bg-slate-800/30">
                    <td className="py-3 font-semibold text-slate-200">{t.name}</td>
                    <td className="py-3 text-slate-300">{t.attempts}</td>
                    <td className="py-3 font-bold text-indigo-300">{t.accuracy}%</td>
                    <td className="py-3 font-mono text-rose-400">{t.weakness_score}</td>
                    <td className="py-3 font-mono text-emerald-400">{t.confidence_score}</td>
                    <td className="py-3"><Badge type={t.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // MAIN ROOT COMPONENT
    const App = () => {
      const [state, setState] = React.useState(loadState());
      const [activeTab, setActiveTab] = React.useState("dashboard");
      const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col md:flex-row">
          <Sidebar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            user={state.user}
            mobileMenuOpen={mobileMenuOpen}
            setMobileMenuOpen={setMobileMenuOpen}
          />
          <main className="md:ml-64 flex-1 p-4 sm:p-8 overflow-y-auto">
            {activeTab === "dashboard" && <DashboardPage state={state} setActiveTab={setActiveTab} setMobileMenuOpen={setMobileMenuOpen} />}
            {activeTab === "subjects" && <SubjectsPage state={state} setActiveTab={setActiveTab} setMobileMenuOpen={setMobileMenuOpen} />}
            {activeTab === "take-quiz" && <TakeQuizPage state={state} setState={setState} setMobileMenuOpen={setMobileMenuOpen} />}
            {activeTab === "recommendations" && <RecommendationsPage state={state} setMobileMenuOpen={setMobileMenuOpen} />}
            {activeTab === "performance" && <PerformancePage state={state} setMobileMenuOpen={setMobileMenuOpen} />}
            {activeTab === "study-plan" && <RecommendationsPage state={state} setMobileMenuOpen={setMobileMenuOpen} />}
            {activeTab === "learning-profile" && <PerformancePage state={state} setMobileMenuOpen={setMobileMenuOpen} />}
            {activeTab === "profile" && <DashboardPage state={state} setActiveTab={setActiveTab} setMobileMenuOpen={setMobileMenuOpen} />}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
