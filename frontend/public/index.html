<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Twin — Intelligent Personalized Learning Platform</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },
            accent: {
              cyan: '#06b6d4',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#f43f5e',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gradient-text {
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #e879f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body class="custom-scrollbar antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const API_BASE = "/api";

    // Global Auth Utility
    const getAuthToken = () => localStorage.getItem("token");
    const setAuthToken = (token) => localStorage.setItem("token", token);
    const removeAuthToken = () => localStorage.removeItem("token");

    // Fetch Wrapper
    async function apiFetch(endpoint, options = {}) {
      const token = getAuthToken();
      const headers = {
        "Content-Type": "application/json",
        ...options.headers,
      };
      if (token) {
        headers["Authorization"] = `Bearer ${token}`;
      }
      const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      if (response.status === 401) {
        removeAuthToken();
        window.location.reload();
        throw new Error("Unauthorized");
      }
      if (!response.ok) {
        const err = await response.json().catch(() => ({ detail: "Request failed" }));
        throw new Error(err.detail || "API Error");
      }
      return response.json();
    }

    // Components
    const Badge = ({ type, text }) => {
      const colors = {
        Strong: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
        Average: "bg-blue-500/10 text-blue-400 border-blue-500/20",
        Weak: "bg-amber-500/10 text-amber-400 border-amber-500/20",
        "Very Weak": "bg-rose-500/10 text-rose-400 border-rose-500/20",
        "High": "bg-rose-500/10 text-rose-400 border-rose-500/20",
        "Medium": "bg-amber-500/10 text-amber-400 border-amber-500/20",
      };
      const cls = colors[type] || "bg-indigo-500/10 text-indigo-400 border-indigo-500/20";
      return (
        <span class={`px-2.5 py-1 rounded-full text-xs font-semibold border ${cls} inline-flex items-center gap-1`}>
          {text || type}
        </span>
      );
    };

    // Navigation Sidebar
    const Sidebar = ({ activeTab, setActiveTab, user, onLogout }) => {
      const navItems = [
        { id: "dashboard", label: "Dashboard", icon: "layout-dashboard" },
        { id: "subjects", label: "My Subjects", icon: "book-open" },
        { id: "study-plan", label: "Study Plan", icon: "calendar" },
        { id: "take-quiz", label: "Take Quiz", icon: "help-circle" },
        { id: "performance", label: "Performance", icon: "bar-chart-2" },
        { id: "recommendations", label: "AI Recommendations", icon: "sparkles" },
        { id: "learning-profile", label: "Learning Profile", icon: "brain" },
        { id: "profile", label: "Student Profile", icon: "user" },
      ];

      React.useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab]);

      return (
        <aside className="w-64 glass-nav h-screen fixed left-0 top-0 z-30 flex flex-col justify-between p-4">
          <div>
            <div className="flex items-center gap-3 px-3 py-4 mb-4">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/30">
                AI
              </div>
              <div>
                <h1 className="font-heading font-bold text-lg leading-none gradient-text">AI Study Twin</h1>
                <p className="text-xs text-slate-400 mt-1">Smart Student Copilot</p>
              </div>
            </div>

            <nav className="space-y-1">
              {navItems.map((item) => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-200 ${
                      isActive
                        ? "bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 shadow-md shadow-indigo-500/10"
                        : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"
                    }`}
                  >
                    <i data-lucide={item.icon} className={`w-4 h-4 ${isActive ? "text-indigo-400" : "text-slate-400"}`}></i>
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>
          </div>

          <div className="pt-4 border-t border-slate-800">
            <div className="flex items-center justify-between px-3 py-2">
              <div className="flex items-center gap-2 overflow-hidden">
                <div className="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-indigo-400 font-bold text-sm">
                  {user?.full_name?.charAt(0) || "S"}
                </div>
                <div className="truncate">
                  <p className="text-xs font-semibold text-slate-200 truncate">{user?.full_name || "Student"}</p>
                  <p className="text-[10px] text-slate-400 truncate">Online</p>
                </div>
              </div>
              <button
                onClick={onLogout}
                title="Logout"
                className="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-rose-500/10 transition-colors"
              >
                <i data-lucide="log-out" className="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </aside>
      );
    };

    // Header Bar
    const Header = ({ title, subtitle, user }) => {
      return (
        <header className="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-6 border-b border-slate-800/80 gap-4">
          <div>
            <h2 className="font-heading font-bold text-2xl text-slate-100">{title}</h2>
            {subtitle && <p className="text-sm text-slate-400 mt-1">{subtitle}</p>}
          </div>
          <div className="flex items-center gap-3">
            <div className="px-3 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-medium flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              AI Twin Active & Syncing
            </div>
          </div>
        </header>
      );
    };

    // DASHBOARD PAGE
    const DashboardPage = ({ setActiveTab, onStartQuizWithTopic }) => {
      const [data, setData] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const trendChartRef = React.useRef(null);
      const subjChartRef = React.useRef(null);

      React.useEffect(() => {
        apiFetch("/dashboard")
          .then((res) => {
            setData(res);
            setLoading(false);
          })
          .catch((err) => console.error(err));
      }, []);

      React.useEffect(() => {
        if (!data || !window.Chart) return;

        // Line Chart for Trend
        const ctxTrend = document.getElementById("trendChart");
        if (ctxTrend) {
          if (trendChartRef.current) trendChartRef.current.destroy();
          trendChartRef.current = new window.Chart(ctxTrend, {
            type: "line",
            data: {
              labels: data.performance_trend.map((t) => t.date),
              datasets: [
                {
                  label: "Accuracy %",
                  data: data.performance_trend.map((t) => t.score),
                  borderColor: "#6366f1",
                  backgroundColor: "rgba(99, 102, 241, 0.15)",
                  fill: true,
                  tension: 0.4,
                  pointRadius: 4,
                  pointBackgroundColor: "#818cf8",
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { min: 40, max: 100, grid: { color: "rgba(255,255,255,0.05)" }, ticks: { color: "#94a3b8" } },
                x: { grid: { display: false }, ticks: { color: "#94a3b8" } },
              },
            },
          });
        }

        // Bar Chart for Subjects
        const ctxSubj = document.getElementById("subjChart");
        if (ctxSubj) {
          if (subjChartRef.current) subjChartRef.current.destroy();
          subjChartRef.current = new window.Chart(ctxSubj, {
            type: "bar",
            data: {
              labels: data.subject_performance.map((s) => s.code),
              datasets: [
                {
                  label: "Subject Performance %",
                  data: data.subject_performance.map((s) => s.accuracy),
                  backgroundColor: ["#6366f1", "#06b6d4", "#10b981", "#f59e0b"],
                  borderRadius: 6,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { min: 0, max: 100, grid: { color: "rgba(255,255,255,0.05)" }, ticks: { color: "#94a3b8" } },
                x: { grid: { display: false }, ticks: { color: "#94a3b8" } },
              },
            },
          });
        }
      }, [data]);

      if (loading) {
        return <div className="p-8 text-center text-slate-400">Loading student learning dashboard...</div>;
      }

      return (
        <div>
          <Header title="Learning Twin Dashboard" subtitle="Real-time academic performance & AI recommended study path" />

          {/* Top Metric Cards */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div className="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <p className="text-xs font-semibold text-slate-400">Overall Performance</p>
                <h3 className="text-2xl font-bold font-heading text-slate-100 mt-1">{data.overall_performance_pct}%</h3>
                <p className="text-xs text-emerald-400 font-medium mt-1">Level: {data.current_learning_level}</p>
              </div>
              <div className="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                <i data-lucide="award" className="w-6 h-6"></i>
              </div>
            </div>

            <div className="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <p className="text-xs font-semibold text-slate-400">Topics Mastered</p>
                <h3 className="text-2xl font-bold font-heading text-emerald-400 mt-1">{data.topics_mastered_count}</h3>
                <p className="text-xs text-slate-400 mt-1">Score 80%+ Accuracy</p>
              </div>
              <div className="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                <i data-lucide="check-circle" className="w-6 h-6"></i>
              </div>
            </div>

            <div className="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <p className="text-xs font-semibold text-slate-400">Topics Needing Revision</p>
                <h3 className="text-2xl font-bold font-heading text-rose-400 mt-1">{data.topics_needing_revision_count}</h3>
                <p className="text-xs text-amber-400 mt-1">High priority focus</p>
              </div>
              <div className="w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
                <i data-lucide="alert-triangle" className="w-6 h-6"></i>
              </div>
            </div>

            <div className="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <p className="text-xs font-semibold text-slate-400">Predicted Next Score</p>
                <h3 className="text-2xl font-bold font-heading text-cyan-400 mt-1">{data.predicted_next_quiz_score}%</h3>
                <p className="text-xs text-slate-400 mt-1">ML Score Regression</p>
              </div>
              <div className="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
                <i data-lucide="trending-up" className="w-6 h-6"></i>
              </div>
            </div>
          </div>

          {/* AI Recommendation Banner */}
          <div className="glass-card rounded-2xl p-5 mb-6 border-l-4 border-l-indigo-500 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-start gap-4">
              <div className="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">
                <i data-lucide="sparkles" className="w-5 h-5"></i>
              </div>
              <div>
                <span className="text-xs font-semibold uppercase tracking-wider text-indigo-400">Top AI Recommendation</span>
                <h4 className="font-heading font-bold text-lg text-slate-100 mt-0.5">
                  Recommended Study Focus: <span className="text-indigo-300">{data.recommended_topic}</span>
                </h4>
                <p className="text-xs text-slate-300 mt-1">{data.recommendation_reason}</p>
              </div>
            </div>
            <button
              onClick={() => setActiveTab("take-quiz")}
              className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 flex items-center gap-2 shrink-0 self-start md:self-auto"
            >
              <span>Start Target Quiz</span>
              <i data-lucide="arrow-right" className="w-4 h-4"></i>
            </button>
          </div>

          {/* Charts Row */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div className="glass-card rounded-2xl p-5">
              <h4 className="font-heading font-semibold text-slate-200 mb-4 flex items-center gap-2">
                <i data-lucide="trending-up" className="w-4 h-4 text-indigo-400"></i>
                Performance Trend (Recent Quizzes)
              </h4>
              <div className="h-64">
                <canvas id="trendChart"></canvas>
              </div>
            </div>

            <div className="glass-card rounded-2xl p-5">
              <h4 className="font-heading font-semibold text-slate-200 mb-4 flex items-center gap-2">
                <i data-lucide="bar-chart" className="w-4 h-4 text-cyan-400"></i>
                Subject Mastery Comparison
              </h4>
              <div className="h-64">
                <canvas id="subjChart"></canvas>
              </div>
            </div>
          </div>

          {/* Today's Study Plan & Weak Topics Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 glass-card rounded-2xl p-5">
              <div className="flex items-center justify-between mb-4">
                <h4 className="font-heading font-semibold text-slate-200 flex items-center gap-2">
                  <i data-lucide="calendar" className="w-4 h-4 text-emerald-400"></i>
                  Today's Dynamic Study Plan
                </h4>
                <button onClick={() => setActiveTab("study-plan")} className="text-xs text-indigo-400 hover:underline">
                  View Full Schedule
                </button>
              </div>
              <div className="space-y-3">
                {data.todays_study_plan.map((item, i) => (
                  <div key={i} className="p-3.5 rounded-xl bg-slate-800/40 border border-slate-700/50 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 font-bold text-xs flex items-center justify-center">
                        {i + 1}
                      </div>
                      <div>
                        <p className="text-sm font-semibold text-slate-200">{item.topic_name}</p>
                        <p className="text-xs text-slate-400">{item.subject_name} • {item.revision_required} Revision</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="px-2.5 py-1 rounded-md bg-slate-900 text-xs font-mono text-indigo-300">
                        {item.duration_minutes} min
                      </span>
                      <button
                        onClick={() => setActiveTab("take-quiz")}
                        className="px-3 py-1.5 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 text-xs font-medium transition-colors"
                      >
                        Start Session
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Weak & Strong Topics Badges */}
            <div className="glass-card rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <h4 className="font-heading font-semibold text-slate-200 mb-3 flex items-center gap-2">
                  <i data-lucide="alert-circle" className="w-4 h-4 text-rose-400"></i>
                  Detected Weak Topics
                </h4>
                <div className="flex flex-wrap gap-2 mb-6">
                  {data.weak_topics.length > 0 ? (
                    data.weak_topics.map((t, idx) => (
                      <span key={idx} className="px-3 py-1.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-medium">
                        {t}
                      </span>
                    ))
                  ) : (
                    <p className="text-xs text-slate-400">No weak topics detected!</p>
                  )}
                </div>

                <h4 className="font-heading font-semibold text-slate-200 mb-3 flex items-center gap-2">
                  <i data-lucide="shield-check" className="w-4 h-4 text-emerald-400"></i>
                  Strong Topics
                </h4>
                <div className="flex flex-wrap gap-2">
                  {data.strong_topics.map((t, idx) => (
                    <span key={idx} className="px-3 py-1.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs font-medium">
                      {t}
                    </span>
                  ))}
                </div>
              </div>

              <div className="pt-4 border-t border-slate-800 mt-4">
                <button
                  onClick={() => setActiveTab("take-quiz")}
                  className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition-colors flex items-center justify-center gap-2"
                >
                  <i data-lucide="play-circle" className="w-4 h-4 text-indigo-400"></i>
                  Launch Practice Diagnostic
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // MY SUBJECTS PAGE
    const SubjectsPage = ({ setActiveTab }) => {
      const [subjects, setSubjects] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        apiFetch("/subjects")
          .then((res) => {
            setSubjects(res);
            setLoading(false);
          })
          .catch((err) => console.error(err));
      }, []);

      if (loading) return <div className="p-8 text-center text-slate-400">Loading subjects catalog...</div>;

      return (
        <div>
          <Header title="My Enrolled Subjects" subtitle="Explore curriculum topics and baseline topic strength" />
          <div className="space-y-6">
            {subjects.map((sub) => (
              <div key={sub.id} className="glass-card rounded-2xl p-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4 pb-4 border-b border-slate-800">
                  <div>
                    <span className="px-2.5 py-1 rounded-md bg-indigo-500/10 text-indigo-400 font-mono text-xs font-bold border border-indigo-500/20">
                      {sub.code}
                    </span>
                    <h3 className="font-heading font-bold text-xl text-slate-100 mt-2">{sub.name}</h3>
                    <p className="text-xs text-slate-400 mt-1">{sub.description}</p>
                  </div>
                  <button
                    onClick={() => setActiveTab("take-quiz")}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition-colors flex items-center gap-2 self-start sm:self-auto"
                  >
                    <span>Take Subject Quiz</span>
                    <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {sub.topics.map((top) => (
                    <div key={top.id} className="p-4 rounded-xl bg-slate-800/40 border border-slate-700/40 flex flex-col justify-between">
                      <div>
                        <div className="flex items-start justify-between gap-2 mb-2">
                          <h4 className="font-semibold text-sm text-slate-200">{top.name}</h4>
                          <Badge type={top.status_label} />
                        </div>
                        <p className="text-xs text-slate-400 mb-3">Difficulty Level: {top.difficulty_level}/5</p>
                      </div>

                      <div>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-slate-400">Accuracy</span>
                          <span className="font-semibold text-indigo-300">{top.accuracy}%</span>
                        </div>
                        <div className="w-full h-2 rounded-full bg-slate-700 overflow-hidden">
                          <div
                            className={`h-full rounded-full ${
                              top.accuracy >= 80
                                ? "bg-emerald-400"
                                : top.accuracy >= 60
                                ? "bg-blue-400"
                                : top.accuracy >= 40
                                ? "bg-amber-400"
                                : "bg-rose-400"
                            }`}
                            style={{ width: `${Math.max(5, top.accuracy)}%` }}
                          ></div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // STUDY PLAN PAGE
    const StudyPlanPage = ({ setActiveTab }) => {

    // ADAPTIVE QUIZ PAGE
    const TakeQuizPage = () => {
      const [subjects, setSubjects] = React.useState([]);
      const [selectedSubject, setSelectedSubject] = React.useState("");
      const [selectedTopic, setSelectedTopic] = React.useState("");
      const [topics, setTopics] = React.useState([]);

      // Quiz execution state
      const [quizData, setQuizData] = React.useState(null);
      const [currentQIndex, setCurrentQIndex] = React.useState(0);
      const [selectedAnswers, setSelectedAnswers] = React.useState({});
      const [startTime, setStartTime] = React.useState(null);
      const [result, setResult] = React.useState(null);
      const [loading, setLoading] = React.useState(false);

      React.useEffect(() => {
        apiFetch("/subjects")
          .then((res) => {
            setSubjects(res);
            if (res.length > 0) {
              setSelectedSubject(res[0].id);
              setTopics(res[0].topics);
            }
          })
          .catch((err) => console.error(err));
      }, []);

      const handleSubjectChange = (e) => {
        const subId = parseInt(e.target.value);
        setSelectedSubject(subId);
        const sub = subjects.find((s) => s.id === subId);
        setTopics(sub ? sub.topics : []);
        setSelectedTopic("");
      };

      const startQuiz = async () => {
        setLoading(true);
        setResult(null);
        setSelectedAnswers({});
        setCurrentQIndex(0);

        try {
          const body = {
            subject_id: parseInt(selectedSubject),
            topic_id: selectedTopic ? parseInt(selectedTopic) : null,
            question_count: 5,
          };
          const data = await apiFetch("/quiz/start", {
            method: "POST",
            body: JSON.stringify(body),
          });
          setQuizData(data);
          setStartTime(Date.now());
        } catch (err) {
          alert("Failed to start quiz: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      const selectOption = (questionId, option) => {
        setSelectedAnswers((prev) => ({ ...prev, [questionId]: option }));
      };

      const submitQuiz = async () => {
        setLoading(true);
        const timeTaken = Math.round((Date.now() - startTime) / 1000);
        const answersList = quizData.questions.map((q) => ({
          question_id: q.id,
          selected_option: selectedAnswers[q.id] || "A",
        }));

        try {
          const res = await apiFetch("/quiz/submit", {
            method: "POST",
            body: JSON.stringify({
              attempt_id: quizData.attempt_id,
              answers: answersList,
              time_taken_seconds: timeTaken,
            }),
          });
          setResult(res);
          setQuizData(null);
        } catch (err) {
          alert("Failed to submit quiz: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      React.useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [quizData, result, currentQIndex]);

      // Active Quiz Question View
      if (quizData) {
        const q = quizData.questions[currentQIndex];
        const isLast = currentQIndex === quizData.questions.length - 1;
        const progressPct = ((currentQIndex + 1) / quizData.questions.length) * 100;

        return (
          <div className="max-w-3xl mx-auto">
            {/* Top Bar */}
            <div className="glass-card rounded-2xl p-4 mb-6 flex items-center justify-between">
              <div>
                <span className="text-xs text-indigo-400 font-mono font-bold uppercase">{quizData.subject_name}</span>
                <h3 className="font-heading font-bold text-lg text-slate-100">{quizData.topic_name}</h3>
              </div>
              <div className="text-right">
                <span className="text-xs text-slate-400 block">ML Predicted Score</span>
                <span className="text-sm font-bold text-cyan-400">{quizData.predicted_score}%</span>
              </div>
            </div>

            {/* Progress Bar */}
            <div className="w-full h-2 rounded-full bg-slate-800 mb-6 overflow-hidden">
              <div className="h-full bg-indigo-500 transition-all duration-300" style={{ width: `${progressPct}%` }}></div>
            </div>

            {/* Question Card */}
            <div className="glass-card rounded-2xl p-6 mb-6">
              <div className="flex items-center justify-between text-xs text-slate-400 mb-4 pb-3 border-b border-slate-800">
                <span>Question {currentQIndex + 1} of {quizData.questions.length}</span>
                {q.sub_concept && <span className="text-indigo-400">Concept: {q.sub_concept}</span>}
              </div>

              <h3 className="font-heading font-bold text-lg text-slate-100 mb-6 leading-relaxed">
                {q.question_text}
              </h3>

              {/* MCQ Options */}
              <div className="space-y-3">
                {["A", "B", "C", "D"].map((optKey) => {
                  const optText = q[`option_${optKey.toLowerCase()}`];
                  const isSelected = selectedAnswers[q.id] === optKey;
                  return (
                    <button
                      key={optKey}
                      onClick={() => selectOption(q.id, optKey)}
                      className={`w-full text-left p-4 rounded-xl border font-medium text-sm transition-all duration-200 flex items-center gap-3 ${
                        isSelected
                          ? "bg-indigo-600/20 border-indigo-500 text-indigo-200 shadow-md shadow-indigo-500/10"
                          : "bg-slate-800/40 border-slate-700/60 text-slate-300 hover:bg-slate-800 hover:border-slate-600"
                      }`}
                    >
                      <span className={`w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center ${
                        isSelected ? "bg-indigo-600 text-white" : "bg-slate-700 text-slate-400"
                      }`}>
                        {optKey}
                      </span>
                      <span className="flex-1">{optText}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center justify-between">
              <button
                disabled={currentQIndex === 0}
                onClick={() => setCurrentQIndex((prev) => prev - 1)}
                className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold disabled:opacity-40"
              >
                Previous
              </button>

              {isLast ? (
                <button
                  disabled={loading}
                  onClick={submitQuiz}
                  className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg shadow-emerald-500/20"
                >
                  {loading ? "Grading & Updating Profile..." : "Submit Quiz"}
                </button>
              ) : (
                <button
                  onClick={() => setCurrentQIndex((prev) => prev + 1)}
                  className="px-6 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold"
                >
                  Next Question
                </button>
              )}
            </div>
          </div>
        );
      }

      // Quiz Results & AI Explanation View
      if (result) {
        const isPosDiff = result.score_diff >= 0;
        return (
          <div className="max-w-4xl mx-auto space-y-6">
            {/* Top Score Comparison Banner */}
            <div className="glass-card rounded-2xl p-6 text-center border-t-4 border-t-indigo-500">
              <span className="text-xs font-semibold uppercase tracking-wider text-indigo-400">Quiz Completed</span>
              <h2 className="font-heading font-bold text-3xl text-slate-100 mt-1">Quiz Results & Profile Sync</h2>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 my-6">
                <div className="p-4 rounded-xl bg-slate-800/60 border border-slate-700">
                  <p className="text-xs text-slate-400">Predicted Score</p>
                  <p className="text-2xl font-bold font-heading text-cyan-400 mt-1">{result.predicted_score}%</p>
                </div>

                <div className="p-4 rounded-xl bg-slate-800/60 border border-indigo-500/40 shadow-lg shadow-indigo-500/10">
                  <p className="text-xs text-slate-400">Actual Score</p>
                  <p className="text-3xl font-bold font-heading text-emerald-400 mt-1">{result.actual_score}%</p>
                </div>

                <div className="p-4 rounded-xl bg-slate-800/60 border border-slate-700">
                  <p className="text-xs text-slate-400">Prediction Difference</p>
                  <p className={`text-2xl font-bold font-heading mt-1 ${isPosDiff ? "text-emerald-400" : "text-rose-400"}`}>
                    {isPosDiff ? `+${result.score_diff}%` : `${result.score_diff}%`}
                  </p>
                </div>
              </div>

              {/* AI Explanation Summary */}
              <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-left">
                <h4 className="font-heading font-bold text-sm text-indigo-300 flex items-center gap-2 mb-2">
                  <i data-lucide="sparkles" className="w-4 h-4"></i>
                  AI Performance Feedback & Learning Profile Update
                </h4>
                <p className="text-xs text-slate-200 leading-relaxed mb-3">{result.recommended_revision}</p>
                <p className="text-xs text-indigo-300">
                  <strong>Recommended Next Topic:</strong> {result.next_recommended_topic}
                </p>
              </div>
            </div>

            {/* Answer Explanations List */}
            <div className="space-y-4">
              <h3 className="font-heading font-bold text-lg text-slate-100">Detailed Conceptual Breakdown</h3>
              {result.explanations.map((item, idx) => (
                <div
                  key={idx}
                  className={`glass-card rounded-2xl p-5 border-l-4 ${
                    item.is_correct ? "border-l-emerald-500" : "border-l-rose-500"
                  }`}
                >
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-semibold text-slate-400">Question {idx + 1}</span>
                    <span className={`px-2.5 py-0.5 rounded-md text-xs font-bold ${
                      item.is_correct ? "bg-emerald-500/10 text-emerald-400" : "bg-rose-500/10 text-rose-400"
                    }`}>
                      {item.is_correct ? "Correct ✓" : "Incorrect ✗"}
                    </span>
                  </div>
                  <h4 className="font-medium text-sm text-slate-200 mb-3">{item.question_text}</h4>
                  <div className="text-xs text-slate-300 space-y-1 mb-3">
                    <p>Your Selected Option: <strong className="text-slate-100">{item.selected_option}</strong></p>
                    <p>Correct Option: <strong className="text-emerald-400">{item.correct_option}</strong></p>
                  </div>
                  <div className="p-3 rounded-lg bg-slate-900/60 border border-slate-800 text-xs text-slate-300">
                    <strong className="text-indigo-400 block mb-1">AI Explanation:</strong>
                    {item.explanation}
                  </div>
                </div>
              ))}
            </div>

            <div className="text-center pt-4">
              <button
                onClick={() => setResult(null)}
                className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold"
              >
                Take Another Quiz
              </button>
            </div>
          </div>
        );
      }

      // Quiz Selector View
      return (
        <div className="max-w-2xl mx-auto">
          <Header title="AI Adaptive Quiz Generator" subtitle="Generate personalized diagnostic quizzes aligned with your weak topics" />

          <div className="glass-card rounded-2xl p-6 space-y-5">
            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-2">Select Subject</label>
              <select
                value={selectedSubject}
                onChange={handleSubjectChange}
                className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
              >
                {subjects.map((s) => (
                  <option key={s.id} value={s.id}>{s.name} ({s.code})</option>
                ))}
              </select>
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-2">Select Topic (Optional — Default targets weakest topic)</label>
              <select
                value={selectedTopic}
                onChange={(e) => setSelectedTopic(e.target.value)}
                className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
              >
                <option value="">🎯 Dynamic AI Mode (Target Weakest Topic)</option>
                {topics.map((t) => (
                  <option key={t.id} value={t.id}>{t.name} ({t.status_label})</option>
                ))}
              </select>
            </div>

            <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-start gap-3">
              <i data-lucide="info" className="w-5 h-5 text-indigo-400 shrink-0 mt-0.5"></i>
              <p className="text-xs text-indigo-200 leading-relaxed">
                Before the quiz starts, our <strong>Random Forest Regressor ML Model</strong> will analyze your historical accuracy, attempt frequency, and topic difficulty to output a predicted score.
              </p>
            </div>

            <button
              disabled={loading}
              onClick={startQuiz}
              className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2"
            >
              {loading ? "Generating Quiz & Running ML Model..." : "Generate Diagnostic Quiz"}
            </button>
          </div>
        </div>
      );

    // PERFORMANCE ANALYTICS PAGE

      const [loading, setLoading] = React.useState(true);

      const radarRef = React.useRef(null);
      const doughnutRef = React.useRef(null);

      React.useEffect(() => {
        apiFetch("/performance")
          .then((res) => {
            setAnalytics(res);
            setLoading(false);
          })
          .catch((err) => console.error(err));
      }, []);

      React.useEffect(() => {
        if (!analytics || !window.Chart) return;

        // Doughnut Chart
        const ctxDoughnut = document.getElementById("doughnutChart");
        if (ctxDoughnut) {
          if (doughnutRef.current) doughnutRef.current.destroy();
          doughnutRef.current = new window.Chart(ctxDoughnut, {
            type: "doughnut",
            data: {
              labels: analytics.doughnut.labels,
              datasets: [
                {
                  data: analytics.doughnut.counts,
                  backgroundColor: ["#10b981", "#3b82f6", "#f43f5e"],
                  borderWidth: 0,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: "bottom", labels: { color: "#cbd5e1" } } },
            },
          });
        }

        // Radar Chart
        const ctxRadar = document.getElementById("radarChart");
        if (ctxRadar) {
          if (radarRef.current) radarRef.current.destroy();
          radarRef.current = new window.Chart(ctxRadar, {
            type: "radar",
            data: {
              labels: analytics.radar.labels,
              datasets: [
                {
                  label: "Topic Accuracy %",
                  data: analytics.radar.values,
                  borderColor: "#06b6d4",
                  backgroundColor: "rgba(6, 182, 212, 0.2)",
                  pointBackgroundColor: "#06b6d4",
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                r: {
                  min: 0,

                  ticks: { display: false },
                },
              },
              plugins: { legend: { display: false } },

                Topic Strengths Radar Map
              </h4>
              <div className="h-64">
                <canvas id="radarChart"></canvas>
              </div>
            </div>
          </div>

          {/* Detailed Topic Table */}
          <div className="glass-card rounded-2xl p-5">
            <h4 className="font-heading font-semibold text-slate-200 mb-4">Topic Performance Matrix</h4>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-800 text-slate-400">

                    <th className="pb-3">Subject</th>

                    <th className="pb-3">Accuracy</th>
                    <th className="pb-3">Weakness Score</th>
                    <th className="pb-3">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/50">
                  {analytics.topic_table.map((row, idx) => (
                    <tr key={idx} className="hover:bg-slate-800/30">

                      <td className="py-3 text-slate-400">{row.subject_name}</td>

            </div>

          .then((res) => {

                  <tr key={idx} className="hover:bg-slate-800/30">
                    <td className="py-3 font-semibold text-slate-200">{row.topic_name}</td>
                    <td className="py-3 text-slate-400">{row.subject_name}</td>
                    <td className="py-3 text-slate-300">{row.attempts}</td>
                    <td className="py-3 font-bold text-indigo-300">{row.accuracy}%</td>
                    <td className="py-3 text-slate-300">{row.recent_score}%</td>
                    <td className="py-3 font-mono text-rose-400">{row.weakness_score}</td>
                    <td className="py-3 font-mono text-emerald-400">{row.confidence_score}</td>
                    <td className="py-3"><Badge type={row.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // PROFILE PAGE
    const ProfilePage = ({ user, onUpdateProfile }) => {
      const [formData, setFormData] = React.useState({
        full_name: user?.full_name || "",
        college: user?.college || "",
        course: user?.course || "",
        semester: user?.semester || "",
        learning_goals: user?.learning_goals || "",
      });
      const [msg, setMsg] = React.useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        try {
          const updated = await apiFetch("/student/profile", {
            method: "PUT",
            body: JSON.stringify(formData),
          });
          onUpdateProfile(updated);
          setMsg("Profile successfully updated!");
        } catch (err) {
          setMsg("Error updating profile: " + err.message);
        }
      };

      return (
        <div className="max-w-2xl mx-auto">
          <Header title="Student Profile Settings" subtitle="Manage your academic background and learning goals" />

          {msg && <div className="p-3 mb-4 rounded-xl bg-indigo-500/20 text-indigo-300 text-xs font-semibold">{msg}</div>}

          <form onSubmit={handleSubmit} className="glass-card rounded-2xl p-6 space-y-4">
            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
              <input
                type="text"
                value={formData.full_name}
                onChange={(e) => setFormData({ ...formData, full_name: e.target.value })}
                className="w-full px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
              />
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">College / University</label>
              <input
                type="text"
                value={formData.college}
                onChange={(e) => setFormData({ ...formData, college: e.target.value })}
                className="w-full px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
              />
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Course / Major</label>
                <input
                  type="text"
                  value={formData.course}
                  onChange={(e) => setFormData({ ...formData, course: e.target.value })}
                  className="w-full px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Semester</label>
                <input
                  type="text"
                  value={formData.semester}
                  onChange={(e) => setFormData({ ...formData, semester: e.target.value })}
                  className="w-full px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                />
              </div>
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">Learning Goals</label>
              <textarea
                rows="3"
                value={formData.learning_goals}
                onChange={(e) => setFormData({ ...formData, learning_goals: e.target.value })}
                className="w-full px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
              ></textarea>
            </div>

            <button
              type="submit"
              className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold"
            >
              Save Profile Changes
            </button>
          </form>
        </div>
      );
    };

    // AUTH (LOGIN / REGISTER) PAGE
    const AuthPage = ({ onAuthSuccess }) => {
      const [isLogin, setIsLogin] = React.useState(true);
      const [email, setEmail] = React.useState("student@demo.edu");
      const [password, setPassword] = React.useState("password123");
      const [fullName, setFullName] = React.useState("Alex Mercer");
      const [error, setError] = React.useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError("");
        const endpoint = isLogin ? "/auth/login" : "/auth/register";
        const body = isLogin ? { email, password } : { email, password, full_name: fullName };

        try {
          const res = await apiFetch(endpoint, {
            method: "POST",
            body: JSON.stringify(body),
          });
          setAuthToken(res.access_token);
          onAuthSuccess();
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
          <div className="w-full max-w-md glass-card rounded-3xl p-8 shadow-2xl border border-slate-800">
            <div className="text-center mb-6">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-2xl mx-auto shadow-lg shadow-indigo-500/30 mb-3">
                AI
              </div>
              <h2 className="font-heading font-bold text-2xl text-slate-100">AI Study Twin</h2>
              <p className="text-xs text-slate-400 mt-1">Sign in to your personalized AI learning twin</p>
            </div>

            {error && <div className="p-3 mb-4 rounded-xl bg-rose-500/20 text-rose-300 text-xs text-center font-medium">{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-4">
              {!isLogin && (
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
                  <input
                    type="text"
                    required
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                  />
                </div>
              )}

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Student Email</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"
                />
              </div>

              <button
                type="submit"
                className="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 transition-all"
              >
                {isLogin ? "Sign In to Dashboard" : "Register Account"}
              </button>
            </form>

            <div className="mt-6 pt-4 border-t border-slate-800 text-center">
              <button
                onClick={() => setIsLogin(!isLogin)}
                className="text-xs text-indigo-400 hover:underline font-medium"
              >
                {isLogin ? "Need an account? Register demo student" : "Already registered? Sign in"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // MAIN APP ROOT COMPONENT
    const App = () => {
      const [authenticated, setAuthenticated] = React.useState(!!getAuthToken());
      const [user, setUser] = React.useState(null);
      const [activeTab, setActiveTab] = React.useState("dashboard");

      const loadUserProfile = () => {
        if (!getAuthToken()) return;
        apiFetch("/student/profile")
          .then((res) => setUser(res))
          .catch((err) => console.error(err));
      };

      React.useEffect(() => {
        if (authenticated) {
          loadUserProfile();
        }
      }, [authenticated]);

      const handleLogout = () => {
        removeAuthToken();
        setAuthenticated(false);
        setUser(null);
      };

      if (!authenticated) {
        return <AuthPage onAuthSuccess={() => setAuthenticated(true)} />;
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex">
          <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} user={user} onLogout={handleLogout} />

          <main className="ml-64 flex-1 p-8 overflow-y-auto">
            {activeTab === "dashboard" && <DashboardPage setActiveTab={setActiveTab} />}
            {activeTab === "subjects" && <SubjectsPage setActiveTab={setActiveTab} />}
            {activeTab === "study-plan" && <StudyPlanPage setActiveTab={setActiveTab} />}
            {activeTab === "take-quiz" && <TakeQuizPage />}
            {activeTab === "performance" && <PerformancePage />}
            {activeTab === "recommendations" && <RecommendationsPage />}
            {activeTab === "learning-profile" && <LearningProfilePage />}
            {activeTab === "profile" && <ProfilePage user={user} onUpdateProfile={setUser} />}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
